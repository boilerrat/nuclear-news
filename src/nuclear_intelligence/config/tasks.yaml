information_discovery:
  description: >
    Identify and collect recent publications, announcements, and discussions
    related to {topic} within the nuclear industry and radiation safety domain.
    Focus on developments from the past {time_window} (typically past week or month).
    Search across multiple source types including:
    - Peer-reviewed journal articles (Health Physics, Radiation Protection Dosimetry, etc.)
    - Regulatory announcements (NRC, IAEA, national regulatory bodies)
    - Industry publications and news
    - Conference proceedings and presentations
    - Technical reports and white papers
    
    For each source, extract complete metadata including:
    - Title and publication source
    - Publication date
    - Authors (where available)
    - Direct URL for verification
    - Brief summary or abstract
    
    Prioritize source diversity to ensure coverage across different publication
    types and perspectives. Aim for at least 10-15 distinct, high-quality sources.
    Use domain-specific search terms covering the full breadth of the nuclear industry,
    including: radiation safety and health physics; nuclear power plant operations and
    maintenance; reactor design, technology, and innovation; nuclear fuel cycle and
    materials management; radioactive waste management and disposal; nuclear security
    and safeguards; decommissioning and remediation; advanced reactor concepts (SMRs,
    Generation IV); nuclear medicine and industrial applications; fusion energy research;
    environmental monitoring and impact assessment; emergency preparedness and response;
    dosimetry and contamination control; ALARA implementation; regulatory compliance
    and policy developments; international cooperation and standards; workforce
    development and training; public engagement and communication.
  expected_output: >
    A structured list of at least 10-15 distinct sources, each containing:
    - Complete metadata (title, source, date, authors, URL)
    - Brief content summary or abstract
    - Preliminary relevance indicator
    - Source type classification (journal, regulatory, industry, conference, etc.)
    
    The list should demonstrate source diversity and focus on authoritative,
    credible sources within the radiation safety domain.
  agent: research_agent

content_analysis:
  description: >
    Evaluate each information item discovered in the previous task for relevance,
    quality, and significance to radiation safety and protection practices.
    
    For each item, assess:
    - Technical merit and methodological soundness
    - Practical applicability to real-world radiation safety challenges
    - Regulatory compliance implications
    - Novelty and significance (major development vs. incremental advance)
    - Relationship to established practices and knowledge
    
    Extract key technical parameters, measurements, or recommendations.
    Identify any limitations, uncertainties, or controversial aspects.
    Note connections and relationships between different items.
    
    Provide structured assessments that enable effective synthesis in the
    next stage. Focus on content that offers genuine value to radiation safety
    professionals.
  expected_output: >
    Detailed assessments for each information item, including:
    - Relevance score (high/medium/low)
    - Significance rating (major development/incremental advance/background information)
    - Key findings summary (2-3 sentences capturing essential points)
    - Technical highlights (specific measurements, methods, recommendations)
    - Identified limitations or uncertainties
    - Relationships to other items in the collection
    
    Organize assessments to highlight the most significant developments while
    maintaining awareness of the broader information landscape.
  agent: analysis_agent
  context:
    - information_discovery

content_synthesis:
  description: >
    Transform the analyzed information into a coherent, sophisticated narrative
    that connects individual developments, identifies themes and trends, and
    provides deep contextual understanding within the broader nuclear industry.

    Organize content by thematic categories such as technology and instrumentation
    advances, regulatory developments and compliance, operational improvements,
    research findings and scientific advances, and industry trends and market
    developments. Present all content in detailed narrative paragraphs, avoiding
    any list formatting.

    Within each theme, weave developments together chronologically where
    appropriate, creating flowing prose that contextualizes developments within
    regulatory frameworks (NRC, IAEA, international standards) and industry
    practices. Explain technical concepts with appropriate depth and nuance,
    avoiding oversimplification while maintaining clarity. Discuss implications
    for different stakeholder groups through integrated analysis rather than
    separate enumeration.

    Maintain technical rigor and sophistication appropriate for nuclear industry
    professionals. Use substantive paragraphs with sophisticated sentence
    structures. Provide deep technical detail with rich explanatory context.
    Identify gaps in current knowledge or areas requiring further investigation
    through analytical discussion.

    Target audience: Nuclear industry professionals including health physicists,
    radiation safety officers, reactor operators, nuclear engineers, regulatory
    personnel, and technical decision-makers with expertise in their respective
    domains.
  expected_output: >
    A comprehensive synthesis document written entirely in narrative prose,
    organized into thematic sections. The document should open with a clear
    introduction establishing context and significance through substantive
    paragraphs. Thematic sections should present detailed discussions of key
    developments in flowing narrative form, drawing connections between related
    items through sophisticated analysis. Implications for different stakeholder
    groups should be woven into the discussion rather than enumerated separately.
    Conclusions should summarize the state of the field and highlight areas of
    active development through rich, analytical paragraphs.

    The synthesis must be written in sophisticated, technically rigorous prose
    without any bullet points, numbered lists, or em dashes. Maintain technical
    accuracy while ensuring readability through well-crafted narrative paragraphs,
    with citations linking assertions to source materials.
  agent: synthesis_agent
  context:
    - content_analysis

report_generation:
  description: >
    Transform the synthesized content into a polished, well-formatted report
    optimized for distribution. Apply consistent markdown structure with
    appropriate heading hierarchy. Format citations according to standard
    practices, ensuring all claims are properly attributed with accessible
    references for verification.

    CRITICAL WRITING STYLE REQUIREMENTS:
    - Use detailed narrative prose throughout the entire report
    - NEVER use bullet points, numbered lists, or any list formatting
    - NEVER use em dashes (—) in the text
    - Write in flowing, substantive paragraphs that provide deep analysis
    - Avoid overly simplistic language; write for technical professionals
    - Connect ideas through transitional sentences rather than lists
    - Integrate multiple points within cohesive paragraphs
    - Use sophisticated sentence structures and varied paragraph lengths
    - Provide contextual depth and nuanced analysis in all sections

    Create clear section breaks and transitions using prose, not lists.
    Ensure paragraphs are substantial and information-rich, presenting
    detailed analysis rather than surface-level summaries. Generate an
    executive summary or abstract that captures key findings in narrative
    form for readers who need a quick overview.

    Format: Technical report in markdown
    Target audience: Nuclear industry professionals and technical experts
    Style: Professional, sophisticated, technically rigorous, narrative-driven

    Save the final report to the outputs directory with a descriptive filename
    that includes the date and topic keywords.
  expected_output: >
    A markdown-formatted report file written entirely in narrative prose,
    containing title and metadata, executive summary in paragraph form,
    thematic sections with detailed analysis presented as flowing narrative
    text, conclusions and implications discussed in substantive paragraphs,
    and references with complete citations integrated smoothly into the text.

    The report must contain NO bullet points, NO numbered lists, NO em dashes,
    and NO simplistic formatting. All content should be presented in
    sophisticated, technically rigorous paragraphs that provide deep contextual
    analysis. The report should have consistent formatting, proper structure,
    and be ready for distribution, review, or publication. The file should be
    saved to the outputs directory.
  agent: report_formatting_agent
  context:
    - content_synthesis


