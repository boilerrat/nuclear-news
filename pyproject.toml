[project]
name = "nuclear-intelligence"
version = "0.1.0"
description = "Nuclear Industry Intelligence System - Multi-agent AI system for radiation safety information aggregation and synthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.152.0",
    "crewai-tools>=0.1.0",
    "crawl4ai>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true


